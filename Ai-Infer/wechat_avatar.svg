<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <!-- 渐变背景 -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a73e8;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#0d47a1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0d2b6e;stop-opacity:1" />
    </linearGradient>
    <!-- 发光效果 -->
    <radialGradient id="glowGrad" cx="50%" cy="30%" r="60%">
      <stop offset="0%" style="stop-color:#4fc3f7;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#4fc3f7;stop-opacity:0" />
    </radialGradient>
    <!-- 剪裁为圆形 -->
    <clipPath id="circleClip">
      <circle cx="200" cy="200" r="195" />
    </clipPath>
    <!-- 神经网络节点渐变 -->
    <radialGradient id="nodeGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#80deea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0288d1;stop-opacity:1" />
    </radialGradient>
  </defs>

  <!-- 圆形背景 -->
  <circle cx="200" cy="200" r="195" fill="url(#bgGrad)" />

  <!-- 外层发光边框 -->
  <circle cx="200" cy="200" r="195" fill="none" stroke="#4fc3f7" stroke-width="3" opacity="0.5" />
  <circle cx="200" cy="200" r="190" fill="none" stroke="#1a73e8" stroke-width="1.5" opacity="0.6" />
  <circle cx="200" cy="200" r="5" fill="url(#glowGrad)" />

  <!-- 神经网络：节点和连线 -->
  <g opacity="0.6">
    <!-- 连接线 -->
    <line x1="140" y1="120" x2="180" y2="100" stroke="#80deea" stroke-width="1.5" opacity="0.5" />
    <line x1="180" y1="100" x2="220" y2="110" stroke="#80deea" stroke-width="1.5" opacity="0.5" />
    <line x1="220" y1="110" x2="260" y2="130" stroke="#80deea" stroke-width="1.5" opacity="0.5" />
    <line x1="140" y1="120" x2="160" y2="150" stroke="#80deea" stroke-width="1.5" opacity="0.5" />
    <line x1="160" y1="150" x2="200" y2="140" stroke="#80deea" stroke-width="1.5" opacity="0.5" />
    <line x1="200" y1="140" x2="240" y2="160" stroke="#80deea" stroke-width="1.5" opacity="0.5" />
    <line x1="260" y1="130" x2="240" y2="160" stroke="#80deea" stroke-width="1.5" opacity="0.5" />
    <line x1="180" y1="100" x2="160" y2="150" stroke="#80deea" stroke-width="1.5" opacity="0.5" />
    <line x1="220" y1="110" x2="200" y2="140" stroke="#80deea" stroke-width="1.5" opacity="0.5" />

    <!-- 节点 -->
    <circle cx="140" cy="120" r="5" fill="url(#nodeGrad)" />
    <circle cx="180" cy="100" r="6" fill="url(#nodeGrad)" />
    <circle cx="220" cy="110" r="5" fill="url(#nodeGrad)" />
    <circle cx="260" cy="130" r="6" fill="url(#nodeGrad)" />
    <circle cx="160" cy="150" r="5" fill="url(#nodeGrad)" />
    <circle cx="200" cy="140" r="5" fill="url(#nodeGrad)" />
    <circle cx="240" cy="160" r="6" fill="url(#nodeGrad)" />

    <!-- 节点发光 -->
    <circle cx="180" cy="100" r="10" fill="none" stroke="#80deea" stroke-width="1" opacity="0.4" />
    <circle cx="260" cy="130" r="10" fill="none" stroke="#80deea" stroke-width="1" opacity="0.4" />
    <circle cx="240" cy="160" r="10" fill="none" stroke="#80deea" stroke-width="1" opacity="0.4" />
  </g>

  <!-- 电路/科技感弧线 -->
  <path d="M 80 280 Q 100 250 130 260 Q 150 270 140 290" fill="none" stroke="#4fc3f7" stroke-width="1.5" opacity="0.4" />
  <path d="M 270 290 Q 260 270 280 250 Q 300 240 320 260" fill="none" stroke="#4fc3f7" stroke-width="1.5" opacity="0.4" />
  <circle cx="140" cy="290" r="2" fill="#4fc3f7" opacity="0.5" />
  <circle cx="270" cy="290" r="2" fill="#4fc3f7" opacity="0.5" />

  <!-- AI 图标 - 大脑/芯片中心图案 -->
  <!-- 芯片外框 -->
  <rect x="155" y="175" width="90" height="70" rx="8" ry="8" fill="none" stroke="#4fc3f7" stroke-width="2" opacity="0.8" />
  <!-- 芯片内框 -->
  <rect x="165" y="185" width="70" height="50" rx="4" ry="4" fill="none" stroke="#80deea" stroke-width="1.5" opacity="0.6" />

  <!-- 芯片引脚 -->
  <line x1="175" y1="175" x2="175" y2="165" stroke="#4fc3f7" stroke-width="2" opacity="0.6" />
  <line x1="200" y1="175" x2="200" y2="165" stroke="#4fc3f7" stroke-width="2" opacity="0.6" />
  <line x1="225" y1="175" x2="225" y2="165" stroke="#4fc3f7" stroke-width="2" opacity="0.6" />
  <line x1="175" y1="245" x2="175" y2="255" stroke="#4fc3f7" stroke-width="2" opacity="0.6" />
  <line x1="200" y1="245" x2="200" y2="255" stroke="#4fc3f7" stroke-width="2" opacity="0.6" />
  <line x1="225" y1="245" x2="225" y2="255" stroke="#4fc3f7" stroke-width="2" opacity="0.6" />
  <line x1="155" y1="195" x2="145" y2="195" stroke="#4fc3f7" stroke-width="2" opacity="0.6" />
  <line x1="155" y1="220" x2="145" y2="220" stroke="#4fc3f7" stroke-width="2" opacity="0.6" />
  <line x1="245" y1="195" x2="255" y2="195" stroke="#4fc3f7" stroke-width="2" opacity="0.6" />
  <line x1="245" y1="220" x2="255" y2="220" stroke="#4fc3f7" stroke-width="2" opacity="0.6" />

  <!-- 芯片中心 - AI 文本 -->
  <text x="200" y="215" font-family="Arial Black, Helvetica, sans-serif" font-size="24" font-weight="bold" fill="#e3f2fd" text-anchor="middle" dominant-baseline="middle" letter-spacing="2">AI</text>

  <!-- 底部文字：AI全栈工程师 -->
  <text x="200" y="310" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="22" font-weight="bold" fill="#e3f2fd" text-anchor="middle" dominant-baseline="middle" letter-spacing="1">
    AI全栈工程师
  </text>

  <!-- 文字下方装饰线 -->
  <line x1="150" y1="328" x2="250" y2="328" stroke="#4fc3f7" stroke-width="1.5" opacity="0.5" />

  <!-- 底部小亮点 -->
  <circle cx="190" cy="338" r="2" fill="#4fc3f7" opacity="0.6" />
  <circle cx="200" cy="340" r="2.5" fill="#80deea" opacity="0.8" />
  <circle cx="210" cy="338" r="2" fill="#4fc3f7" opacity="0.6" />

  <!-- 外围科技感虚线圆环 -->
  <circle cx="200" cy="200" r="175" fill="none" stroke="#4fc3f7" stroke-width="0.5" stroke-dasharray="4,8" opacity="0.3" />
  <circle cx="200" cy="200" r="185" fill="none" stroke="#4fc3f7" stroke-width="0.5" stroke-dasharray="2,6" opacity="0.2" />

  <!-- 上部装饰星星 -->
  <text x="100" y="90" font-size="8" fill="#80deea" opacity="0.4">✦</text>
  <text x="310" y="100" font-size="6" fill="#80deea" opacity="0.3">✦</text>
  <text x="70" y="180" font-size="5" fill="#80deea" opacity="0.3">✦</text>
  <text x="335" y="200" font-size="7" fill="#80deea" opacity="0.3">✦</text>

  <!-- 代码角标 -->
  <text x="85" y="360" font-family="Courier New, monospace" font-size="10" fill="#4fc3f7" opacity="0.35">&lt;/&gt;</text>
  <text x="300" y="78" font-family="Courier New, monospace" font-size="10" fill="#4fc3f7" opacity="0.35">{ }</text>
</svg>
